# vps-fleet.conf — VPS cu user de admin + cheie, acces DOAR pe chei.
# Pentru flotă: schimbă adresa de mail și pool-ul, păstrează structura.
# Rulare: sudo bash debian-setup.sh --config examples/vps-fleet.conf -y
# (SSH_KEY_FILE e relativ la directorul din care rulezi; ex. din rădăcina repo-ului)
MODE=vps
WIREGUARD_CIDR=10.8.0.0/24

# user de administrare + cheie publică (înlocuiește cu cheia TA!)
CREATE_USER=admin
SSH_KEY_FILE=examples/admin_key.pub
SSH_KEYS_ONLY=yes
ALLOW_USERS=admin

INSTALL_DOCKER=yes
INSTALL_TAILSCALE=yes
INSTALL_FAIL2BAN=yes
INSTALL_AUTO_UPDATES=yes
UPDATE_THIRD_PARTY=yes

DOCKER_POOL=10.200.0.0/16
DOCKER_BIND_LOCALHOST=yes

# unattended: reboot programat + raport pe mail (necesită MTA instalat)
AUTO_REBOOT=04:00
MAIL_ADDR=ops@example.com
