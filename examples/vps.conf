# vps.conf — VPS public, SSH doar din VPN (WireGuard/Tailscale)
# Rulare: sudo bash debian-setup.sh --config examples/vps.conf -y
# Atenție: fără WireGuard sau Tailscale activ, îți blochezi SSH-ul.
MODE=vps
WIREGUARD_CIDR=10.8.0.0/24

INSTALL_DOCKER=yes
INSTALL_TAILSCALE=yes
INSTALL_FAIL2BAN=yes
INSTALL_AUTO_UPDATES=yes

DOCKER_POOL=10.200.0.0/16
DOCKER_BIND_LOCALHOST=yes
