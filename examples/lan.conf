# lan.conf — server în rețeaua locală (NAS / mini-PC / VM de laborator)
# Rulare: sudo bash debian-setup.sh --config examples/lan.conf -y
MODE=lan
LAN_CIDR=192.168.1.0/24
WIREGUARD_CIDR=10.8.0.0/24

INSTALL_DOCKER=yes
INSTALL_TAILSCALE=yes
INSTALL_FAIL2BAN=yes
INSTALL_AUTO_UPDATES=yes

# Docker: pool separat + publicări legate implicit de localhost
DOCKER_POOL=10.200.0.0/16
DOCKER_BIND_LOCALHOST=yes
