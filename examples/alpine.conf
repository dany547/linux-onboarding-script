# Alpine 3.24 stable only; explicit opt-in to Docker/Compose and Tailscale.
# Preview with: sh setup.sh --dry-run -y --config examples/alpine.conf
# Apply on a booted Alpine/OpenRC host as root after reviewing the plan.
# This does not establish a firewall policy or authenticate Tailscale.
MODE=lan
INSTALL_DOCKER=yes
INSTALL_TAILSCALE=yes
SKIP_UPGRADE=yes
MANAGE_SSH=no
SKIP_FIREWALL=yes
INSTALL_FAIL2BAN=no
INSTALL_AUTO_UPDATES=no
